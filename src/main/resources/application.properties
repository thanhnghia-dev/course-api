spring.application.name=course-api

# ==========================
# Database
# ==========================
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:coursedb}?ssl-mode=REQUIRED
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA & Hibernate
# ==========================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# ==========================
# Jackson
# ==========================
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================
# Logging
# ==========================
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type=trace

# ==========================
# Server
# ==========================
server.address=0.0.0.0
server.port=${PORT:8080}

# ==========================
# JWT
# ==========================
app.security.jwt.secret-key=${JWT_SECRET:4bb6d1dfbafb64a681139d1586b6f1160d18159afd57c8c79136d7490630407c}
app.security.jwt.access-token-expiration=1209600000
app.security.jwt.refresh-token-expiration=2592000000

# ==========================
# Cloudinary
# ==========================
cloudinary.cloud-name=${CLOUDINARY_NAME:dq8tlrd6p}
cloudinary.api-key=${CLOUDINARY_KEY:132283439519637}
cloudinary.api-secret=${CLOUDINARY_SECRET:mLQU3aHKfIho4o-cyRrujEzCtNs}

# ==========================
# File Upload
# ==========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB